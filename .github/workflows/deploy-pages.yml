# Publishes this repo (the pre-built, encrypted output of build_site.py) to GitHub Pages.
# Nothing is built here: CI never sees the password or a plaintext mp3.
# Settings → Pages → Source: "GitHub Actions".
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse plaintext audio
        run: |
          bad=$(find . -path ./.git -prune -o -type f \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.m4a' -o -iname '*.ogg' -o -iname '*.flac' -o -iname '*.aac' \) -print)
          if [ -n "$bad" ]; then echo "plaintext audio in the repo:"; echo "$bad"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
